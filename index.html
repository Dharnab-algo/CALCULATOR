<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Calc — Animated Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>

<div class="calc" role="application" aria-label="Calculator">
  <div class="brand">
    <div class="dot-row">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <span class="label">Glow Calc</span>
  </div>

  <div class="display" id="displayBox">
    <div class="expr" id="expr">&nbsp;</div>
    <div class="result-wrap">
      <div class="result idle" id="result">0</div>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="key func" data-action="clear">AC</button>
    <button class="key func" data-action="backspace">⌫</button>
    <button class="key func" data-action="percent">%</button>
    <button class="key op" data-action="op" data-value="÷">÷</button>

    <button class="key" data-action="num" data-value="7">7</button>
    <button class="key" data-action="num" data-value="8">8</button>
    <button class="key" data-action="num" data-value="9">9</button>
    <button class="key op" data-action="op" data-value="×">×</button>

    <button class="key" data-action="num" data-value="4">4</button>
    <button class="key" data-action="num" data-value="5">5</button>
    <button class="key" data-action="num" data-value="6">6</button>
    <button class="key op" data-action="op" data-value="−">−</button>

    <button class="key" data-action="num" data-value="1">1</button>
    <button class="key" data-action="num" data-value="2">2</button>
    <button class="key" data-action="num" data-value="3">3</button>
    <button class="key op" data-action="op" data-value="+">+</button>

    <button class="key span-2" data-action="num" data-value="0">0</button>
    <button class="key" data-action="dot">.</button>
    <button class="key equals" data-action="equals">=</button>
  </div>

  <div class="footer-note">keyboard supported · try typing numbers</div>
</div>

<script src="script.js"></script>
</body>
</html>
